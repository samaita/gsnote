root = "."

tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/gsnote ./cmd/bot"
entrypoint = "./tmp/gsnote"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = [".git", "models", "notes", "tmp", "vendor"]
exclude_regex = ["_test.go$"]
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true
main_only = false
